[project]
name = "tutorial-agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shekhar", email = "shekharjamalpuri18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=1.0.0",
    "langchain-google-genai>=4.2.2",
    "langchain-groq>=0.3.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.57.0",
    "ipykernel>=7.2.0",
    "notebook>=7.5.6",
    "google-genai>=2.29.0",
    "chromadb>=1.5.9",
    "langchain-community>=0.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.20.0",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
tutorial-agentic-ai = "tutorial_agentic_ai:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
